name: Build Redmi AX3000

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ci-ipq50xx-mainline-kernel-5.15-openwrt-23.05-20260509-161528-UTC
  MIHOMO_VERSION: v1.19.30

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            tar \
            xz-utils \
            gzip \
            git \
            file \
            binutils \
            python3

      - name: Download ImageBuilder
        shell: bash
        run: |
          set -e

          wget -O imagebuilder.tar.xz \
            "https://github.com/Labradors/openwrt-redmi-ax3000/releases/download/${RELEASE_TAG}/openwrt-imagebuilder-ipq50xx-arm.Linux-x86_64.tar.xz"

          mkdir -p imagebuilder

          tar -xJf imagebuilder.tar.xz \
            -C imagebuilder \
            --strip-components=1

          echo "===== ImageBuilder ====="
          ls -lah imagebuilder

          echo "===== repositories.conf ====="
          cat imagebuilder/repositories.conf

      - name: Fix package feed
        shell: bash
        run: |
          set -e

          cd imagebuilder

          sed -i '/immortalwrt_packages/d' repositories.conf

          echo 'src/gz immortalwrt_packages https://downloads.immortalwrt.org/releases/23.05.3/packages/arm_cortex-a7_neon-vfpv4/base' >> repositories.conf

          echo "===== repositories.conf after fix ====="
          cat repositories.conf

      - name: Prepare filesystem
        shell: bash
        run: |
          set -e

          mkdir -p files/usr/local/bin
          mkdir -p files/etc/clash.meta
          mkdir -p files/etc/uci-defaults

      - name: Download Mihomo ARMv7
        shell: bash
        run: |
          set -e

          curl -fsSL \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            -o /tmp/mihomo-release.json

          MIHOMO_URL="$(python3 -c '
          import json
          import sys

          with open("/tmp/mihomo-release.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          matches = []

          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              if "linux-armv7" in name.lower() and name.lower().endswith(".gz"):
                  matches.append((name, url))

          if not matches:
              print("ERROR: Linux ARMv7 Mihomo asset was not found.", file=sys.stderr)

              for asset in data.get("assets", []):
                  print(asset.get("name", ""), file=sys.stderr)

              sys.exit(1)

          matches.sort()
          print(matches[-1][1])
          ')"

          echo "Selected Mihomo:"
          echo "${MIHOMO_URL}"

          wget -O /tmp/mihomo.gz "${MIHOMO_URL}"

          gzip -dc /tmp/mihomo.gz > files/usr/local/bin/mihomo
          chmod 0755 files/usr/local/bin/mihomo

          echo "===== Mihomo ====="
          file files/usr/local/bin/mihomo

          readelf -h files/usr/local/bin/mihomo | \
            grep -E 'Class:|Data:|Machine:'

      - name: Create Mihomo config
        shell: bash
        run: |
          set -e

          cat > files/etc/clash.meta/config.yaml <<'EOF'
          mixed-port: 7890
          tproxy-port: 12345

          allow-lan: true
          bind-address: "*"

          mode: rule
          log-level: warning

          ipv6: false

          dns:
            enable: true
            ipv6: false
            listen: 0.0.0.0:1053

          proxies:
            - name: DIRECT
              type: direct

          proxy-groups:
            - name: PROXY
              type: select
              proxies:
                - DIRECT

          rules:
            - MATCH,PROXY
          EOF

      - name: Enable ZRAM
        shell: bash
        run: |
          set -e

          cat > files/etc/uci-defaults/99-zram-custom <<'EOF'
          #!/bin/sh

          if [ -x /etc/init.d/zram ]; then
              /etc/init.d/zram enable
          fi

          exit 0
          EOF

          chmod 0755 files/etc/uci-defaults/99-zram-custom

      - name: Install TProxy files
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/SmartRouterZone/luci-app-tproxy.git \
            tproxy

          if [ -d tproxy/root ]; then
              cp -a tproxy/root/. files/
          fi

          if [ -d tproxy/htdocs ]; then
              mkdir -p files/www
              cp -a tproxy/htdocs/. files/www/
          fi

          echo "===== Files to embed ====="
          find files -type f -print | sort

      - name: Show ImageBuilder profile
        shell: bash
        run: |
          set -e

          cd imagebuilder
          make info V=s

      - name: Build firmware
        shell: bash
        run: |
          set -e

          cd imagebuilder

          make image \
            PROFILE="redmi_ax3000" \
            PACKAGES="-ath11k-firmware-ipq5018 -ath11k-firmware-qcn6122 zram-swap kmod-zram kmod-nft-tproxy kmod-nft-socket ip-full nftables luci-base" \
            FILES="../files" \
            V=s

      - name: Generate build manifest copy
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== Target files ====="

          find imagebuilder/bin/targets \
            -maxdepth 4 \
            -type f \
            -print \
            2>/dev/null | sort

          echo "===== ImageBuilder package files ====="

          find imagebuilder/packages \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null | sort

          echo "===== Available target manifests ====="

          find imagebuilder/bin/targets \
            -type f \
            -name "*.manifest" \
            -exec sh -c 'echo "----- $1 -----"; cat "$1"' _ {} \; \
            2>/dev/null || true

      - name: Calculate firmware SHA256
        if: success()
        shell: bash
        run: |
          set -e

          find imagebuilder/bin/targets/ipq50xx/arm \
            -type f \
            -name "*redmi_ax3000*.ubi" \
            -exec sha256sum {} \;

      - name: Upload firmware and manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-custom-firmware
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: |
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*.ubi
            imagebuilder/bin/targets/ipq50xx/arm/*.manifest
