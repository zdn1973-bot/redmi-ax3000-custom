name: Build Redmi AX3000

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ci-ipq50xx-mainline-kernel-5.15-openwrt-23.05-20260509-161528-UTC
  MIHOMO_VERSION: v1.19.30

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            tar \
            xz-utils \
            gzip \
            git \
            file \
            binutils \
            python3 \
            squashfs-tools

      - name: Download ImageBuilder
        shell: bash
        run: |
          set -e

          wget -O imagebuilder.tar.xz \
            "https://github.com/Labradors/openwrt-redmi-ax3000/releases/download/${RELEASE_TAG}/openwrt-imagebuilder-ipq50xx-arm.Linux-x86_64.tar.xz"

          mkdir -p imagebuilder

          tar -xJf imagebuilder.tar.xz \
            -C imagebuilder \
            --strip-components=1

          echo "===== repositories.conf BEFORE ====="
          cat imagebuilder/repositories.conf

      - name: Fix repositories
        shell: bash
        run: |
          set -e

          cd imagebuilder

          sed -i '/^[[:space:]]*src\/gz[[:space:]]\+immortalwrt_packages[[:space:]]/d' repositories.conf

          echo 'src/gz immortalwrt_packages https://downloads.immortalwrt.org/releases/23.05.3/packages/arm_cortex-a7_neon-vfpv4/base' >> repositories.conf

          echo "===== repositories.conf AFTER ====="
          cat repositories.conf

      - name: Prepare filesystem
        shell: bash
        run: |
          set -e

          mkdir -p files/usr/local/bin
          mkdir -p files/etc/clash.meta
          mkdir -p files/etc/uci-defaults

      - name: Download Mihomo Linux ARMv7
        shell: bash
        run: |
          set -e

          curl -fsSL \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            -o /tmp/mihomo-release.json

          MIHOMO_URL="$(python3 -c '
          import json
          import sys

          with open("/tmp/mihomo-release.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          candidates = []

          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              if "linux-armv7" in name.lower() and name.lower().endswith(".gz"):
                  candidates.append((name, url))

          if not candidates:
              print("ERROR: Linux ARMv7 Mihomo asset not found.", file=sys.stderr)
              sys.exit(1)

          candidates.sort(key=lambda x: x[0])
          print(candidates[-1][1])
          ')"

          echo "===== Selected Mihomo ====="
          echo "${MIHOMO_URL}"

          wget -O /tmp/mihomo.gz "${MIHOMO_URL}"

          gzip -dc /tmp/mihomo.gz > files/usr/local/bin/mihomo
          chmod 0755 files/usr/local/bin/mihomo

          file files/usr/local/bin/mihomo
          readelf -h files/usr/local/bin/mihomo | \
            grep -E 'Class:|Data:|Machine:'

      - name: Validate Mihomo
        shell: bash
        run: |
          set -e

          MACHINE="$(readelf -h files/usr/local/bin/mihomo | \
            awk -F: '/Machine:/ {
              gsub(/^[ \t]+/, "", $2);
              print $2
            }')"

          echo "Detected architecture: ${MACHINE}"

          case "${MACHINE}" in
            ARM*)
              echo "Mihomo ARM binary confirmed."
              ;;
            *)
              echo "ERROR: Mihomo is not ARM."
              exit 1
              ;;
          esac

      - name: Install TProxy files
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/SmartRouterZone/luci-app-tproxy.git \
            tproxy

          if [ -d tproxy/root ]; then
            cp -a tproxy/root/. files/
          fi

          if [ -d tproxy/htdocs ]; then
            mkdir -p files/www
            cp -a tproxy/htdocs/. files/www/
          fi

          echo "===== Custom files ====="
          find files -type f | sort

      - name: Create minimal Mihomo configuration
        shell: bash
        run: |
          set -e

          cat > files/etc/clash.meta/config.yaml <<'EOF'
          mixed-port: 7890
          tproxy-port: 12345
          allow-lan: true
          bind-address: "*"
          mode: rule
          log-level: warning
          ipv6: false

          dns:
            enable: true
            ipv6: false
            listen: 0.0.0.0:1053

          proxies:
            - name: DIRECT
              type: direct

          proxy-groups:
            - name: PROXY
              type: select
              proxies:
                - DIRECT

          rules:
            - MATCH,PROXY
          EOF

      - name: Enable ZRAM
        shell: bash
        run: |
          set -e

          cat > files/etc/uci-defaults/99-zram-custom <<'EOF'
          #!/bin/sh

          if [ -x /etc/init.d/zram ]; then
              /etc/init.d/zram enable
          fi

          exit 0
          EOF

          chmod 0755 files/etc/uci-defaults/99-zram-custom

      - name: Verify ImageBuilder profile
        shell: bash
        run: |
          set -e

          cd imagebuilder
          make info V=s

      - name: Build firmware
        shell: bash
        run: |
          set -e

          cd imagebuilder

          make image \
            PROFILE="redmi_ax3000" \
            PACKAGES="-ath11k-firmware-ipq5018 -ath11k-firmware-qcn6122 zram-swap kmod-zram kmod-nft-tproxy kmod-nft-socket ip-full nftables luci-base" \
            FILES="../files" \
            V=s

      - name: Verify generated firmware
        shell: bash
        run: |
          set -e

          echo "===== Generated files ====="

          find imagebuilder/bin/targets \
            -type f \
            -print \
            2>/dev/null | sort

          echo "===== UBI files ====="

          UBI_COUNT="$(find imagebuilder/bin/targets \
            -type f \
            -name '*redmi_ax3000*squashfs-nand-factory.ubi' \
            | wc -l)"

          echo "UBI count: ${UBI_COUNT}"

          if [ "${UBI_COUNT}" -ne 1 ]; then
              echo "ERROR: Expected exactly one Redmi AX3000 factory UBI."
              exit 1
          fi

      - name: Extract manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$(find imagebuilder/bin/targets \
            -type f \
            -name '*redmi_ax3000*.manifest' \
            | head -1)"

          if [ -n "${MANIFEST}" ]; then
              echo "===== Manifest ====="
              cat "${MANIFEST}"
          else
              echo "ERROR: Manifest not found."
              exit 1
          fi

      - name: Check important packages
        shell: bash
        run: |
          set -e

          MANIFEST="$(find imagebuilder/bin/targets \
            -type f \
            -name '*redmi_ax3000*.manifest' \
            | head -1)"

          echo "Checking manifest..."

          grep -E \
            '(^|[[:space:]])(zram-swap|kmod-zram|kmod-nft-tproxy|kmod-nft-socket|ip-full)([[:space:]]|$)' \
            "${MANIFEST}" || true

          echo "===== Firmware Wi-Fi packages ====="

          grep -E \
            'ath11k|ipq-wifi-redmi_ax3000' \
            "${MANIFEST}" || true

      - name: Show firmware hashes
        shell: bash
        run: |
          set -e

          find imagebuilder/bin/targets \
            -type f \
            -name '*redmi_ax3000*squashfs-nand-factory.ubi' \
            -exec sha256sum {} \;

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-custom-firmware
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: |
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*squashfs-nand-factory.ubi
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*.manifest
