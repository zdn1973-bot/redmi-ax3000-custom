name: Build Redmi AX3000

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ci-ipq50xx-mainline-kernel-5.15-openwrt-23.05-20260509-161528-UTC

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y wget tar xz-utils

      - name: Download ImageBuilder
        run: |
          set -e
          wget -O imagebuilder.tar.xz "https://github.com/Labradors/openwrt-redmi-ax3000/releases/download/${RELEASE_TAG}/openwrt-imagebuilder-ipq50xx-arm.Linux-x86_64.tar.xz"
          mkdir imagebuilder
          tar -xJf imagebuilder.tar.xz -C imagebuilder --strip-components=1

      - name: Fix repositories
        run: |
          set -e
          sed -i '/immortalwrt_packages/d' imagebuilder/repositories.conf
          echo 'src/gz immortalwrt_packages https://downloads.immortalwrt.org/releases/23.05.3/packages/arm_cortex-a7_neon-vfpv4/base' >> imagebuilder/repositories.conf
          cat imagebuilder/repositories.conf

      - name: Build firmware
        run: |
          set -e
          cd imagebuilder
          make image PROFILE="redmi_ax3000" PACKAGES="zram-swap kmod-zram kmod-nft-tproxy kmod-nft-socket ip-full nftables luci-base" V=s

      - name: Show output
        if: always()
        run: |
          find imagebuilder/bin/targets -type f -print || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-firmware
          path: imagebuilder/bin/targets/**
