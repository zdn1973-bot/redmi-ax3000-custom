name: Build Redmi AX3000

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ci-ipq50xx-mainline-kernel-5.15-openwrt-23.05-20260509-161528-UTC
  MIHOMO_VERSION: v1.19.30

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl tar xz-utils gzip git file binutils python3

      - name: Download ImageBuilder
        run: |
          set -e

          wget -O imagebuilder.tar.xz \
            "https://github.com/Labradors/openwrt-redmi-ax3000/releases/download/${RELEASE_TAG}/openwrt-imagebuilder-ipq50xx-arm.Linux-x86_64.tar.xz"

          mkdir -p imagebuilder

          tar -xJf imagebuilder.tar.xz \
            -C imagebuilder \
            --strip-components=1

          echo "===== ImageBuilder loaded ====="
          ls -lah imagebuilder

      - name: Fix ImageBuilder repositories
        run: |
          set -e

          cd imagebuilder

          sed -i '/immortalwrt_packages/d' repositories.conf

          echo "src/gz immortalwrt_packages https://downloads.immortalwrt.org/releases/23.05.3/packages/arm_cortex-a7_neon-vfpv4/base" >> repositories.conf

          echo "===== repositories.conf ====="
          cat repositories.conf

      - name: Prepare custom files
        run: |
          set -e

          mkdir -p files/usr/local/bin
          mkdir -p files/etc/clash.meta
          mkdir -p files/etc/uci-defaults

      - name: Download Mihomo ARMv7
        run: |
          set -e

          curl -fsSL \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            -o /tmp/mihomo.json

          MIHOMO_URL=$(python3 -c "
          import json

          with open('/tmp/mihomo.json', 'r') as f:
              data = json.load(f)

          found = []

          for asset in data.get('assets', []):
              name = asset.get('name', '').lower()
              url = asset.get('browser_download_url', '')

              if 'linux-armv7' in name and name.endswith('.gz'):
                  found.append((name, url))

          if not found:
              raise SystemExit('Linux ARMv7 Mihomo asset not found')

          found.sort()
          print(found[-1][1])
          ")

          echo "===== Mihomo URL ====="
          echo "$MIHOMO_URL"

          wget -O /tmp/mihomo.gz "$MIHOMO_URL"

          gzip -dc /tmp/mihomo.gz > files/usr/local/bin/mihomo

          chmod 0755 files/usr/local/bin/mihomo

          echo "===== Mihomo information ====="
          file files/usr/local/bin/mihomo
          readelf -h files/usr/local/bin/mihomo | grep Machine

      - name: Create Mihomo configuration
        run: |
          set -e

          printf '%s\n' \
            'mixed-port: 7890' \
            'tproxy-port: 12345' \
            'allow-lan: true' \
            'bind-address: "*"' \
            'mode: rule' \
            'log-level: warning' \
            'ipv6: false' \
            'dns:' \
            '  enable: true' \
            '  ipv6: false' \
            '  listen: 0.0.0.0:1053' \
            'proxies:' \
            '  - name: DIRECT' \
            '    type: direct' \
            'proxy-groups:' \
            '  - name: PROXY' \
            '    type: select' \
            '    proxies:' \
            '      - DIRECT' \
            'rules:' \
            '  - MATCH,PROXY' \
            > files/etc/clash.meta/config.yaml

      - name: Enable ZRAM
        run: |
          set -e

          printf '%s\n' \
            '#!/bin/sh' \
            '' \
            'if [ -x /etc/init.d/zram ]; then' \
            '    /etc/init.d/zram enable' \
            'fi' \
            '' \
            'exit 0' \
            > files/etc/uci-defaults/99-zram-custom

          chmod 0755 files/etc/uci-defaults/99-zram-custom

      - name: Install TProxy files
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/SmartRouterZone/luci-app-tproxy.git \
            tproxy

          if [ -d tproxy/root ]; then
            cp -a tproxy/root/. files/
          fi

          if [ -d tproxy/htdocs ]; then
            mkdir -p files/www
            cp -a tproxy/htdocs/. files/www/
          fi

          echo "===== TProxy files ====="
          find files -type f | sort

      - name: Show profile
        run: |
          set -e

          cd imagebuilder

          make info V=s

      - name: Build firmware
        run: |
          set -e

          cd imagebuilder

          make image \
            PROFILE="redmi_ax3000" \
            PACKAGES="-ath11k-firmware-ipq5018 -ath11k-firmware-qcn6122 zram-swap kmod-zram kmod-nft-tproxy kmod-nft-socket ip-full nftables luci-base" \
            FILES="../files" \
            V=s

      - name: Verify build output
        if: always()
        run: |
          echo "===== BUILD OUTPUT ====="

          find imagebuilder/bin/targets \
            -type f \
            -print \
            2>/dev/null | sort || true

      - name: Create manifest
        if: success()
        run: |
          set -e

          find imagebuilder/bin/targets \
            -type f \
            -printf '%p\n' \
            2>/dev/null | sort \
            > firmware-files.txt

          sha256sum \
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*.ubi \
            > firmware-sha256.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-custom-firmware
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: |
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*.ubi
            firmware-files.txt
            firmware-sha256.txt
