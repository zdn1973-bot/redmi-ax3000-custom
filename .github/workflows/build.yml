name: Build Redmi AX3000

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ci-ipq50xx-mainline-kernel-5.15-openwrt-23.05-20260509-161528-UTC
  MIHOMO_VERSION: v1.19.30

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            tar \
            xz-utils \
            gzip \
            git \
            file \
            binutils \
            python3

      - name: Download ImageBuilder
        shell: bash
        run: |
          set -e

          wget -O imagebuilder.tar.xz \
            "https://github.com/Labradors/openwrt-redmi-ax3000/releases/download/${RELEASE_TAG}/openwrt-imagebuilder-ipq50xx-arm.Linux-x86_64.tar.xz"

          mkdir -p imagebuilder

          tar -xJf imagebuilder.tar.xz \
            -C imagebuilder \
            --strip-components=1

          echo "===== ImageBuilder repositories ====="
          cat imagebuilder/repositories.conf

      - name: Fix repositories
        shell: bash
        run: |
          set -e

          cd imagebuilder

          sed -i '/immortalwrt_packages/d' repositories.conf

          echo 'src/gz immortalwrt_packages https://downloads.immortalwrt.org/releases/packages-23.05/arm_cortex-a7_neon-vfpv4/base' >> repositories.conf

          echo "===== repositories.conf after modification ====="
          cat repositories.conf

      - name: Prepare custom files
        shell: bash
        run: |
          set -e

          mkdir -p files/usr/local/bin
          mkdir -p files/etc/clash.meta
          mkdir -p files/etc/uci-defaults

      - name: Download Mihomo
        shell: bash
        run: |
          set -e

          curl -fsSL \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            -o /tmp/mihomo.json

          python3 - <<'PY'
          import json
          import sys

          with open("/tmp/mihomo.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          found = []

          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              name_l = name.lower()

              if "linux-armv7" in name_l and name_l.endswith(".gz"):
                  found.append((name, url))

          if not found:
              print("ERROR: Linux ARMv7 Mihomo asset not found.")
              print("Available assets:")

              for asset in data.get("assets", []):
                  print(asset.get("name", ""))

              sys.exit(1)

          found.sort()
          name, url = found[-1]

          print("Selected asset:")
          print(name)
          print(url)

          with open("/tmp/mihomo_url", "w", encoding="utf-8") as f:
              f.write(url)
          PY

          MIHOMO_URL="$(cat /tmp/mihomo_url)"

          wget -O /tmp/mihomo.gz "${MIHOMO_URL}"

          gzip -dc /tmp/mihomo.gz > files/usr/local/bin/mihomo

          chmod 0755 files/usr/local/bin/mihomo

          echo "===== Mihomo ====="
          file files/usr/local/bin/mihomo

          readelf -h files/usr/local/bin/mihomo | \
            grep -E 'Class:|Data:|Machine:'

      - name: Create Mihomo config
        shell: bash
        run: |
          set -e

          printf '%s\n' \
            'mixed-port: 7890' \
            'tproxy-port: 12345' \
            '' \
            'allow-lan: true' \
            'bind-address: "*"' \
            '' \
            'mode: rule' \
            'log-level: warning' \
            'ipv6: false' \
            '' \
            'dns:' \
            '  enable: true' \
            '  ipv6: false' \
            '  listen: 0.0.0.0:1053' \
            '' \
            'proxies:' \
            '  - name: DIRECT' \
            '    type: direct' \
            '' \
            'proxy-groups:' \
            '  - name: PROXY' \
            '    type: select' \
            '    proxies:' \
            '      - DIRECT' \
            '' \
            'rules:' \
            '  - MATCH,PROXY' \
            > files/etc/clash.meta/config.yaml

          echo "===== Mihomo config ====="
          cat files/etc/clash.meta/config.yaml

      - name: Install TProxy files
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/SmartRouterZone/luci-app-tproxy.git \
            tproxy

          if [ -d tproxy/root ]; then
            cp -a tproxy/root/. files/
          fi

          if [ -d tproxy/htdocs ]; then
            mkdir -p files/www
            cp -a tproxy/htdocs/. files/www/
          fi

          echo "===== TProxy files ====="
          find files -type f | sort

      - name: Enable ZRAM
        shell: bash
        run: |
          set -e

          printf '%s\n' \
            '#!/bin/sh' \
            '' \
            'if [ -x /etc/init.d/zram ]; then' \
            '    /etc/init.d/zram enable' \
            'fi' \
            '' \
            'exit 0' \
            > files/etc/uci-defaults/99-zram-custom

          chmod 0755 files/etc/uci-defaults/99-zram-custom

      - name: Show profile
        shell: bash
        run: |
          set -e
          cd imagebuilder
          make info V=s

      - name: Check firmware package names
        shell: bash
        run: |
          set -e

          cd imagebuilder

          echo "===== Checking ath11k packages ====="

          if grep -Rqs "Package: ath11k-firmware-ipq5018-qcn6122" packages; then
            echo "Combined IPQ5018/QCN6122 firmware package found."
          else
            echo "Combined firmware package was not found in local indexes."
            echo "Available ath11k package entries:"
            grep -Rhs "Package: ath11k-firmware" packages 2>/dev/null | sort -u || true
          fi

      - name: Build firmware
        shell: bash
        run: |
          set -e

          cd imagebuilder

          make image \
            PROFILE="redmi_ax3000" \
            PACKAGES="-ath11k-firmware-ipq5018 -ath11k-firmware-qcn6122 ath11k-firmware-ipq5018-qcn6122 zram-swap kmod-zram kmod-nft-tproxy kmod-nft-socket ip-full nftables luci-base" \
            FILES="../files" \
            V=s

      - name: List generated files
        if: always()
        shell: bash
        run: |
          echo "===== Generated files ====="

          find imagebuilder/bin/targets \
            -type f \
            -print \
            2>/dev/null | sort || true

      - name: Generate manifest
        if: always()
        shell: bash
        run: |
          set -e

          find imagebuilder/bin/targets \
            -type f \
            -name "*.manifest" \
            -exec cat {} \; \
            > firmware-manifest.txt 2>/dev/null || true

          echo "===== Firmware manifest ====="
          cat firmware-manifest.txt 2>/dev/null || true

      - name: Calculate SHA256
        if: always()
        shell: bash
        run: |
          set -e

          find imagebuilder/bin/targets \
            -type f \
            -name "*redmi_ax3000*" \
            -exec sha256sum {} \; \
            > firmware-sha256.txt 2>/dev/null || true

          echo "===== SHA256 ====="
          cat firmware-sha256.txt 2>/dev/null || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-custom-firmware
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: |
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*squashfs-nand-factory.ubi
            firmware-manifest.txt
            firmware-sha256.txt
