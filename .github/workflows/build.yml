name: Build Redmi AX3000

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ci-ipq50xx-mainline-kernel-5.15-openwrt-23.05-20260509-161528-UTC
  MIHOMO_VERSION: v1.19.30

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            tar \
            xz-utils \
            gzip \
            git \
            file \
            binutils \
            python3

      - name: Download ImageBuilder
        shell: bash
        run: |
          set -e

          wget -O imagebuilder.tar.xz \
            "https://github.com/Labradors/openwrt-redmi-ax3000/releases/download/${RELEASE_TAG}/openwrt-imagebuilder-ipq50xx-arm.Linux-x86_64.tar.xz"

          mkdir -p imagebuilder

          tar -xJf imagebuilder.tar.xz \
            -C imagebuilder \
            --strip-components=1

          echo "===== ImageBuilder ====="
          ls -lah imagebuilder

          echo "===== Original repositories.conf ====="
          cat imagebuilder/repositories.conf

      - name: Fix repositories
        shell: bash
        run: |
          set -e

          cd imagebuilder

          sed -i '/immortalwrt_packages/d' repositories.conf

          echo 'src/gz immortalwrt_packages https://downloads.immortalwrt.org/releases/23.05.3/packages/arm_cortex-a7_neon-vfpv4/base' >> repositories.conf

          echo "===== Final repositories.conf ====="
          cat repositories.conf

      - name: Refresh package indexes
        shell: bash
        run: |
          set -e

          cd imagebuilder

          make package_index V=s

      - name: Check WiFi firmware packages
        shell: bash
        run: |
          set -e

          cd imagebuilder

          echo "===== Searching firmware packages ====="

          if grep -Rqs 'Package: ath11k-firmware-ipq5018$' .; then
            echo "FOUND: ath11k-firmware-ipq5018"
          else
            echo "MISSING: ath11k-firmware-ipq5018"
          fi

          if grep -Rqs 'Package: ath11k-firmware-ipq5018-qcn6122$' .; then
            echo "FOUND: ath11k-firmware-ipq5018-qcn6122"
          else
            echo "MISSING: ath11k-firmware-ipq5018-qcn6122"
          fi

          if grep -Rqs 'Package: ath11k-firmware-qcn6122$' .; then
            echo "FOUND: ath11k-firmware-qcn6122"
          else
            echo "MISSING: ath11k-firmware-qcn6122"
          fi

      - name: Prepare filesystem
        shell: bash
        run: |
          set -e

          mkdir -p files/usr/local/bin
          mkdir -p files/etc/clash.meta
          mkdir -p files/etc/uci-defaults

      - name: Download Mihomo ARMv7
        shell: bash
        run: |
          set -e

          curl -fsSL \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            -o /tmp/mihomo-release.json

          MIHOMO_URL="$(python3 -c '
          import json
          import sys

          with open("/tmp/mihomo-release.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          candidates = []

          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              n = name.lower()

              if "linux-armv7" in n and n.endswith(".gz"):
                  candidates.append((name, url))

          if not candidates:
              print("ERROR: linux-armv7 Mihomo asset not found", file=sys.stderr)
              for asset in data.get("assets", []):
                  print(asset.get("name", ""), file=sys.stderr)
              sys.exit(1)

          candidates.sort()
          print(candidates[-1][1])
          ')"

          echo "Selected Mihomo URL:"
          echo "${MIHOMO_URL}"

          wget -O /tmp/mihomo.gz "${MIHOMO_URL}"

          gzip -dc /tmp/mihomo.gz > files/usr/local/bin/mihomo

          chmod 0755 files/usr/local/bin/mihomo

          echo "===== Mihomo binary ====="
          file files/usr/local/bin/mihomo

          readelf -h files/usr/local/bin/mihomo | \
            grep -E 'Class:|Data:|Machine:'

      - name: Verify Mihomo architecture
        shell: bash
        run: |
          set -e

          file files/usr/local/bin/mihomo

          MACHINE="$(readelf -h files/usr/local/bin/mihomo | \
            awk -F: '/Machine:/ {
              gsub(/^[ \t]+/, "", $2);
              print $2
            }')"

          echo "Detected machine: ${MACHINE}"

          case "${MACHINE}" in
            ARM*)
              echo "OK: ARM Mihomo binary"
              ;;
            *)
              echo "ERROR: Wrong Mihomo architecture"
              exit 1
              ;;
          esac

      - name: Create Mihomo directory
        shell: bash
        run: |
          set -e
          mkdir -p files/etc/clash.meta

      - name: Create minimal Mihomo config
        shell: bash
        run: |
          set -e

          printf '%s\n' \
            'mixed-port: 7890' \
            'tproxy-port: 12345' \
            'allow-lan: true' \
            'bind-address: "*"' \
            'mode: rule' \
            'log-level: warning' \
            'ipv6: false' \
            '' \
            'dns:' \
            '  enable: true' \
            '  ipv6: false' \
            '  listen: 0.0.0.0:1053' \
            '' \
            'proxies:' \
            '  - name: DIRECT' \
            '    type: direct' \
            '' \
            'proxy-groups:' \
            '  - name: PROXY' \
            '    type: select' \
            '    proxies:' \
            '      - DIRECT' \
            '' \
            'rules:' \
            '  - MATCH,PROXY' \
            > files/etc/clash.meta/config.yaml

      - name: Enable ZRAM
        shell: bash
        run: |
          set -e

          printf '%s\n' \
            '#!/bin/sh' \
            '' \
            'if [ -x /etc/init.d/zram ]; then' \
            '    /etc/init.d/zram enable' \
            'fi' \
            '' \
            'exit 0' \
            > files/etc/uci-defaults/99-zram-custom

          chmod 0755 files/etc/uci-defaults/99-zram-custom

      - name: Get device package list
        shell: bash
        run: |
          set -e

          cd imagebuilder

          echo "===== PROFILE INFO ====="
          make info V=s

      - name: Build firmware
        shell: bash
        run: |
          set -e

          cd imagebuilder

          make image \
            PROFILE="redmi_ax3000" \
            PACKAGES="-ath11k-firmware-ipq5018 -ath11k-firmware-qcn6122 ath11k-firmware-ipq5018 ath11k-firmware-ipq5018-qcn6122 zram-swap kmod-zram kmod-nft-tproxy kmod-nft-socket ip-full nftables luci-base" \
            FILES="../files" \
            V=s

      - name: List firmware
        if: always()
        shell: bash
        run: |
          echo "===== Generated files ====="

          find imagebuilder/bin/targets \
            -type f \
            -print \
            2>/dev/null | sort || true

      - name: Calculate SHA256
        if: success()
        shell: bash
        run: |
          set -e

          find imagebuilder/bin/targets/ipq50xx/arm \
            -type f \
            -name '*redmi_ax3000*' \
            -exec sha256sum {} \; \
            2>/dev/null || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-custom-firmware
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: |
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*squashfs-nand-factory.ubi
