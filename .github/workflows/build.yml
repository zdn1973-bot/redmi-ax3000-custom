name: Build Redmi AX3000

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ci-ipq50xx-mainline-kernel-5.15-openwrt-23.05-20260509-161528-UTC
  MIHOMO_VERSION: v1.19.30

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            tar \
            gzip \
            xz-utils \
            unzip \
            file \
            python3

      - name: Download ImageBuilder
        shell: bash
        run: |
          set -e

          wget -O imagebuilder.tar.xz \
            "https://github.com/Labradors/openwrt-redmi-ax3000/releases/download/${RELEASE_TAG}/openwrt-imagebuilder-ipq50xx-arm.Linux-x86_64.tar.xz"

          mkdir -p imagebuilder

          tar -xJf imagebuilder.tar.xz \
            -C imagebuilder \
            --strip-components=1

          echo "===== repositories.conf BEFORE ====="
          cat imagebuilder/repositories.conf || true

          echo "===== Fixing repositories.conf ====="

          # Remove the dead OpenWrt URL that was causing:
          # immortalwrt_packages/Packages.gz -> HTTP 404
          sed -i '/^[[:space:]]*src\/gz[[:space:]]\+immortalwrt_packages[[:space:]]/d' \
            imagebuilder/repositories.conf

          # Add the real ImmortalWrt package feed for ARM Cortex-A7 NEON.
          cat >> imagebuilder/repositories.conf <<'EOF'
src/gz immortalwrt_packages https://downloads.immortalwrt.org/releases/23.05.3/packages/arm_cortex-a7_neon-vfpv4/base
EOF

          echo "===== repositories.conf AFTER ====="
          cat imagebuilder/repositories.conf

      - name: Download Mihomo
        shell: bash
        run: |
          set -e

          mkdir -p files/usr/local/bin

          MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-armv7-${MIHOMO_VERSION}.gz"

          echo "Downloading:"
          echo "${MIHOMO_URL}"

          wget -O /tmp/mihomo.gz "${MIHOMO_URL}"

          echo "===== Mihomo file ====="
          ls -lh /tmp/mihomo.gz

          # Verified SHA256 for the exact ARMv7 asset.
          echo "7b4e8793f9f8fa4a21ea66528890ebde5a73d557673fb94d3047eebb60ad7591  /tmp/mihomo.gz" \
            | sha256sum -c -

          gzip -dc /tmp/mihomo.gz > files/usr/local/bin/mihomo
          chmod 0755 files/usr/local/bin/mihomo

          file files/usr/local/bin/mihomo
          ls -lh files/usr/local/bin/mihomo

      - name: Create minimal Mihomo config
        shell: bash
        run: |
          set -e

          mkdir -p files/etc/clash.meta

          cat > files/etc/clash.meta/config.yaml <<'EOF'
          mixed-port: 7890
          tproxy-port: 12345

          allow-lan: true
          bind-address: "*"

          mode: rule
          log-level: warning

          ipv6: false

          dns:
            enable: true
            ipv6: false
            listen: 0.0.0.0:1053

          proxies:
            - name: DIRECT
              type: direct

          proxy-groups:
            - name: PROXY
              type: select
              proxies:
                - DIRECT

          rules:
            - MATCH,PROXY
          EOF

          echo "===== Mihomo config ====="
          cat files/etc/clash.meta/config.yaml

      - name: Create ZRAM first-boot configuration
        shell: bash
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-zram-custom <<'EOF'
          #!/bin/sh

          if [ -x /etc/init.d/zram ]; then
              /etc/init.d/zram enable
          fi

          exit 0
          EOF

          chmod 0755 files/etc/uci-defaults/99-zram-custom

      - name: Prepare image packages
        shell: bash
        run: |
          set -e

          cat > /tmp/packages.txt <<'EOF'
          zram-swap
          kmod-zram
          kmod-nft-tproxy
          kmod-nft-socket
          ip-full
          nftables
          luci-base
          EOF

          echo "===== Requested additional packages ====="
          cat /tmp/packages.txt

      - name: Verify ImageBuilder package availability
        shell: bash
        run: |
          set -e

          cd imagebuilder

          echo "===== ImageBuilder package indexes ====="
          find . -maxdepth 3 -type f \
            \( -name 'Packages' -o -name 'Packages.gz' \) \
            -print | sort | head -100

          echo "===== Profile ====="
          make info V=s

      - name: Build firmware
        shell: bash
        run: |
          set -e

          cd imagebuilder

          make image \
            PROFILE="redmi_ax3000" \
            PACKAGES="zram-swap kmod-zram kmod-nft-tproxy kmod-nft-socket ip-full nftables luci-base" \
            FILES="../files" \
            V=s

      - name: List build output
        if: always()
        shell: bash
        run: |
          echo "===== Build output ====="
          find imagebuilder/bin/targets/ipq50xx/arm \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            2>/dev/null | sort || true

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-custom-firmware
          if-no-files-found: error
          path: |
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*squashfs-nand-factory.ubi
            imagebuilder/bin/targets/ipq50xx/arm/*redmi_ax3000*initramfs-fit-uImage.itb
            imagebuilder/bin/targets/ipq50xx/arm/*.manifest
